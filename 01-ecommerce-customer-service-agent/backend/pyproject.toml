[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cs-agent"
version = "0.1.0"
description = "模拟电商客服：B0可信基础"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlglot>=30.24.0",
  "langgraph>=1.2.16",
  "langgraph-checkpoint-postgres>=3.2.0",
  "langchain>=1.4.7",
  "jieba>=0.42.1",
  "pgvector>=0.5.1",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires verified project-local PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["cs_agent"]
